<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container">
    <span class="d-flex align-items-center gap-1">
      <img class="navbar-brand-icon" src="img/pokeball.png" alt="Imagem de uma Pokébola" />
      <a class="navbar-brand fw-medium" href="#" (click)="fecharMenu()">Pokédex</a>
    </span>

    <button
      class="navbar-toggler"
      type="button"
      aria-controls="navbarNav"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuAberto()"
      (click)="alternarMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAberto()" id="navbarNav">
      <form class="navbar-busca d-flex ms-lg-auto me-lg-4 my-3 my-lg-0" (submit)="buscarPokemon($event)">
        <input
          class="form-control"
          type="search"
          placeholder="Buscar Pokémon..."
          aria-label="Buscar Pokémon pelo nome"
          [value]="nomeBusca()"
          (input)="atualizarBusca($event)"
        />

        <button class="btn btn-outline-primary ms-2" type="submit" aria-label="Pesquisar">
          <i class="bi bi-search"></i>
        </button>
      </form>

      <ul class="navbar-nav">
        @for (item of itensNavbar; track item.titulo) {
          <li class="nav-item">
            <a class="nav-link" [href]="item.url" (click)="fecharMenu()">{{ item.titulo }}</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>

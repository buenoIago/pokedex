@if (favoritos().length > 0) {
  <section aria-labelledby="favoritos-title">
    <div class="container py-3">
      <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
        <h2 id="favoritos-title" class="h5 mb-0">Meus favoritos</h2>
        <span class="small">{{ favoritos().length }} pokémon</span>
      </div>

      <div>
        @for (favorito of favoritos(); track favorito.id) {
          <article>
            <a [routerLink]="['/pokemon', favorito.name]">
              @if (favorito.spriteUrl; as sprite) {
                <img [src]="sprite" [alt]="`Sprite de ${paraTitleCase(favorito.name)}`" />
              } @else {
                <span aria-hidden="true">?</span>
              }
              <span>{{ paraTitleCase(favorito.name) }}</span>
            </a>
          </article>
        }
      </div>
    </div>
  </section>
}
